name: Daily 8AM data refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"
      timezone: "America/Los_Angeles"

permissions:
  contents: write

concurrency:
  group: qf-daily-refresh
  cancel-in-progress: false

jobs:
  refresh-data:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh public dashboard data
        run: python3 scripts/update_data.py

      - name: Save refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          git diff --cached --quiet || git commit -m "data: daily 8AM refresh"
          git push
